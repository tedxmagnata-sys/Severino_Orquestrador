<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Severino Dash Admin</title>
  <style>
    * { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e5e7eb; padding: 2rem; }
    h1 { margin: 0 0 1.5rem; font-size: 1.25rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #93c5fd; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
    .card { background: #111827; border: 1px solid #374151; border-radius: .75rem; padding: 1.25rem; }
    .label { font-size: .75rem; text-transform: uppercase; color: #9ca3af; letter-spacing: .05em; }
    .value { font-size: 1.75rem; font-weight: 700; margin-top: .5rem; color: #f9fafb; }
    .updated { margin-top: 1.5rem; font-size: .75rem; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Severino Â· Dash Admin</h1>
  <div class="grid" id="grid"></div>
  <div class="updated" id="updated"></div>
  <script>
    async function load() {
      try {
        const res = await fetch('/api/public/metrics');
        const data = await res.json();
        const items = [
          { label: 'Visitas hoje', value: data.todayVisits ?? 0 },
          { label: 'Alertas criados', value: data.totalAlertsCreated ?? 0 },
          { label: 'Visitantes Ãºnicos', value: data.totalUniqueVisitors ?? 0 },
          { label: 'Ativos agora', value: data.activeNow ?? 0 },
        ];
        document.getElementById('grid').innerHTML = items.map(it => `
          <div class="card">
            <div class="label">${it.label}</div>
            <div class="value">${it.value}</div>
          </div>
        `).join('');
        document.getElementById('updated').innerText = 'Atualizado: ' + new Date().toLocaleString();
      } catch (e) {
        document.getElementById('updated').innerText = 'Falha ao carregar mÃ©tricas: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
