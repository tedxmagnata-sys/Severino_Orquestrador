<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{PRODUTO_NOME}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 40px; max-width: 420px; width: 90%; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { line-height: 1.6; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; margin: 8px 0 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 16px; cursor: pointer; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{PRODUTO_NOME}</h1>
    <p>{PRODUTO_DESCRICAO}</p>
    <input id="email" type="email" placeholder="Seu melhor e-mail" autocomplete="email">
    <button id="btn">Ativar teste grátis (7 dias)</button>
    <div id="msg" class="msg" style="display:none"></div>
  </div>
  <script>
    document.getElementById('btn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      if (!email) { msg.style.display = 'block'; msg.textContent = 'Digite seu e-mail.'; return; }
      try {
        const r = await fetch('/api/trial', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, source: 'frontend-offer' }) });
        const j = await r.json();
        msg.style.display = 'block';
        if (j.code) msg.textContent = 'Código liberado: ' + j.code + '\nUse no link abaixo:\n' + (window.location.origin + '/?code=' + j.code);
        else msg.textContent = 'Erro: ' + (j.error || 'tente de novo');
      } catch (e) { msg.style.display = 'block'; msg.textContent = 'Erro de rede.'; }
    };
  </script>
</body>
</html>
